<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#060c21" />
  <title>Angel｜音訊測試</title>

  <style>
    body{
      margin:0;height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;
      background:linear-gradient(to bottom,#0a192f,#060c21);
      color:rgba(255,255,255,.92);
      display:flex;align-items:center;justify-content:center;text-align:center;
      padding:18px;
    }
    .box{max-width:520px;width:100%}
    h1{margin:0 0 10px;font-weight:500;letter-spacing:.08em}
    p{margin:0 0 14px;opacity:.82;line-height:1.7}
    .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
    button,select{
      padding:12px 14px;border-radius:999px;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.10);color:#fff;
      -webkit-tap-highlight-color:transparent;
      font-size:14px;
    }
    button:active{transform:scale(.98)}
    .debug{
      margin-top:16px;
      text-align:left;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size:12px;
      background:rgba(0,0,0,.25);
      border:1px solid rgba(255,255,255,.12);
      border-radius:16px;
      padding:12px;
      line-height:1.6;
      white-space:pre-wrap;
    }
    .tip{margin-top:10px;opacity:.7;font-size:13px;line-height:1.7}
  </style>
</head>

<body>
  <div class="box">
    <h1>Angel</h1>
    <p>請先按一次 🎧。如果沒聲音，再按一次。<br>看下方偵錯列會顯示卡在哪。</p>

    <div class="row">
      <select id="soundSel" aria-label="自然音選擇">
        <option value="night">🌙 夜裡的風</option>
        <option value="ocean">🌊 海浪</option>
        <option value="rain">🌧️ 細雨</option>
      </select>
      <button id="audioBtn" type="button">🎧 開始</button>
    </div>

    <div class="tip">
      若你音量很小，溫和淡入會像沒聲音：請把手機音量先開大一點。<br>
      也請確認沒有連到藍牙耳機/車用音響。
    </div>

    <div class="debug" id="dbg">debug: ready</div>
  </div>

  <audio id="bgAudio" preload="auto" playsinline loop crossorigin="anonymous"></audio>

  <script>
    const dbg = document.getElementById("dbg");
    const btn = document.getElementById("audioBtn");
    const sel = document.getElementById("soundSel");
    const audio = document.getElementById("bgAudio");

    const SOURCES = {
      // 先用外部音源測；若外部不穩，下一步改成本地檔最穩
      night: "https://cdn.pixabay.com/download/audio/2022/02/23/audio_2f3f9b0d55.mp3?filename=night-ambience-110997.mp3",
      ocean: "https://cdn.pixabay.com/download/audio/2021/08/04/audio_12b0c6e6f9.mp3?filename=ocean-waves-ambience-6763.mp3",
      rain:  "https://cdn.pixabay.com/download/audio/2021/09/06/audio_0f3c2e79f1.mp3?filename=rain-ambient-6890.mp3"
    };

    let playing = false;
    let fadeTimer = null;

    function log(line){
      dbg.textContent = (dbg.textContent + "\n" + line).slice(-2000);
    }
    function setSource(key){
      audio.src = SOURCES[key];
      audio.load();
      log("src = " + key);
    }
    function clearFade(){
      if(fadeTimer){ clearInterval(fadeTimer); fadeTimer = null; }
    }
    function fadeIn(target=0.18, duration=4500){
      clearFade();
      audio.volume = 0;
      const steps = Math.max(12, Math.floor(duration/120));
      const step = target/steps;
      fadeTimer = setInterval(()=>{
        audio.volume = Math.min(target, audio.volume + step);
        if(audio.volume >= target){ clearFade(); }
      },120);
    }
    function fadeOutPause(duration=1200){
      clearFade();
      const start = audio.volume || 0.18;
      const steps = Math.max(10, Math.floor(duration/120));
      const step = start/steps;
      fadeTimer = setInterval(()=>{
        audio.volume = Math.max(0, audio.volume - step);
        if(audio.volume <= 0.001){
          clearFade();
          audio.pause();
          audio.currentTime = 0;
        }
      },120);
    }

    // 事件監聽：看看到底卡在哪
    ["loadstart","loadedmetadata","canplay","canplaythrough","playing","pause","stalled","waiting","ended"].forEach(ev=>{
      audio.addEventListener(ev, ()=> log("event: " + ev + " | t=" + audio.currentTime.toFixed(2) + " vol=" + audio.volume.toFixed(2)));
    });
    audio.addEventListener("error", ()=>{
      const err = audio.error;
      log("ERROR: code=" + (err?err.code:"?") + " (1 aborted / 2 network / 3 decode / 4 src not supported)");
    });

    setSource("night");

    sel.addEventListener("change", ()=>{
      setSource(sel.value);
      log("changed: " + sel.value);
      if(playing){
        // 若正在播，換音源要重新按一次更穩（先簡化測試）
        playing = false;
        btn.textContent = "🎧 開始";
        audio.pause();
      }
    });

    btn.addEventListener("click", async ()=>{
      log("CLICK");
      if(!playing){
        try{
          audio.muted = true;
          await audio.play(); // 解鎖
          audio.muted = false;

          playing = true;
          btn.textContent = "🫧 停下來";
          fadeIn();
          log("play OK (unlocked)");
        }catch(e){
          log("play FAIL: " + (e && e.message ? e.message : String(e)));
          alert("播放被擋，請再點一次（或確認音量/輸出裝置）。");
        }
      }else{
        playing = false;
        btn.textContent = "🎧 開始";
        fadeOutPause();
        log("stop requested");
      }
    });

    // 每秒顯示狀態
    setInterval(()=>{
      log("state: paused=" + audio.paused + " readyState=" + audio.readyState + " networkState=" + audio.networkState);
    }, 2000);
  </script>
</body>
</html>
